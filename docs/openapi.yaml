openapi: 3.0.3
info:
  title: notifd Notification System
  version: 1.0.0
  description: |
    Event-driven notification system. Accepts SMS / Email / Push notifications,
    queues them asynchronously through Asynq (Redis), rate-limits delivery at
    100 messages/second/channel using a distributed token bucket, and streams
    real-time status changes over WebSocket.
servers:
  - url: http://localhost:8080
    description: Local docker-compose

tags:
  - name: notifications
  - name: batches
  - name: templates
  - name: observability

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [observability]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up
  /readyz:
    get:
      tags: [observability]
      summary: Readiness probe (Postgres + Redis reachable)
      security: []
      responses:
        "200": { description: All dependencies healthy }
        "503": { description: At least one dependency unhealthy }
  /metrics:
    get:
      tags: [observability]
      summary: Prometheus metrics exposition
      security: []
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain: {}

  /v1/notifications:
    post:
      tags: [notifications]
      summary: Create a single notification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Notification" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [notifications]
      summary: List notifications with cursor pagination
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, processing, sent, failed, canceled, dead_letter] }
        - in: query
          name: channel
          schema: { type: string, enum: [sms, email, push] }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  next_cursor: { type: string }

  /v1/notifications/batch:
    post:
      tags: [notifications]
      summary: Create up to 1000 notifications in one request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/notifications/{id}:
    get:
      tags: [notifications]
      summary: Fetch a notification by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Notification" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/notifications/{id}/cancel:
    post:
      tags: [notifications]
      summary: Cancel a pending or scheduled notification
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Canceled }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/batches/{batch_id}:
    get:
      tags: [batches]
      summary: Aggregate summary for a batch
      parameters:
        - in: path
          name: batch_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id: { type: string, format: uuid }
                  total: { type: integer }
                  by_status:
                    type: object
                    additionalProperties: { type: integer }
                  created_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/templates:
    get:
      tags: [templates]
      summary: List every template
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
    post:
      tags: [templates]
      summary: Create a notification template
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTemplateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/templates/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [templates]
      summary: Fetch a template by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [templates]
      summary: Update subject and body of an existing template (name/channel/locale immutable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_tmpl]
              properties:
                subject_tmpl: { type: string }
                body_tmpl:    { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [templates]
      summary: Delete a template
      description: |
        Prior notifications keep their `template_id` pointer — the column is
        not a foreign key so we preserve audit trail ("this was rendered from
        a template that has since been deleted").
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/templates/{id}/preview:
    post:
      tags: [templates]
      summary: Dry-run render against a variable map, no persistence
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Rendered subject + body
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  body:    { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ws/batch/{batch_id}:
    get:
      tags: [notifications]
      summary: WebSocket stream of status events for a batch
      description: |
        Upgrade an HTTP connection to WebSocket. The server emits JSON
        envelopes `{notification_id, status, error?, timestamp}` as worker
        tasks transition. Auth: either `Authorization: Bearer <jwt>` or
        `?token=<jwt>` query parameter (browsers cannot set headers on
        WebSocket handshakes).
      parameters:
        - in: path
          name: batch_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: token
          required: false
          schema: { type: string }
      responses:
        "101": { description: Switching Protocols }
        "401": { description: Invalid or missing JWT }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, format: uuid }
    RequestID:
      in: header
      name: X-Request-ID
      required: false
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing / invalid bearer token
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Idempotency collision or terminal state
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    CreateRequest:
      type: object
      required: [recipient, channel, priority]
      description: |
        Supply **either** `content` (channel-specific raw payload) **or**
        `template_id` + `variables`. The server rejects requests containing both
        or neither with 400.
      properties:
        recipient: { type: string, description: "E.164 phone / email / push token depending on channel" }
        channel:   { type: string, enum: [sms, email, push] }
        priority:  { type: string, enum: [high, normal, low] }
        content:   { type: object }
        template_id: { type: string, format: uuid }
        variables:
          type: object
          description: "Free-form map of {{.var}} substitutions for the referenced template."
          additionalProperties: true
        scheduled_at: { type: string, format: date-time, nullable: true }

    CreateTemplateRequest:
      type: object
      required: [name, channel, body_tmpl]
      properties:
        name:         { type: string }
        channel:      { type: string, enum: [sms, email, push] }
        locale:       { type: string, default: "en-US" }
        subject_tmpl: { type: string, description: "Required for email, forbidden for sms/push" }
        body_tmpl:    { type: string, description: "Go text/template syntax, e.g. 'Hello {{.name}}'" }

    Template:
      type: object
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        channel:      { type: string }
        locale:       { type: string }
        subject_tmpl: { type: string, nullable: true }
        body_tmpl:    { type: string }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    BatchRequest:
      type: object
      required: [channel, priority, content, items]
      properties:
        channel:  { type: string, enum: [sms, email, push] }
        priority: { type: string, enum: [high, normal, low] }
        content:  { type: object }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [recipient]
            properties:
              recipient:       { type: string }
              idempotency_key: { type: string }

    BatchResponse:
      type: object
      properties:
        batch_id: { type: string, format: uuid }
        accepted: { type: integer }

    Notification:
      type: object
      properties:
        id:                   { type: string, format: uuid }
        batch_id:             { type: string, format: uuid, nullable: true }
        template_id:          { type: string, format: uuid, nullable: true, description: "Set when the notification was rendered from a stored template." }
        channel:              { type: string }
        priority:             { type: string }
        recipient:            { type: string }
        status:               { type: string }
        attempts:             { type: integer }
        last_error:           { type: string, nullable: true }
        provider_message_id:  { type: string, nullable: true }
        scheduled_at:         { type: string, format: date-time, nullable: true }
        sent_at:              { type: string, format: date-time, nullable: true }
        created_at:           { type: string, format: date-time }
        updated_at:           { type: string, format: date-time }

    Error:
      type: object
      properties:
        error:      { type: string, description: "Machine-readable code (e.g. invalid_input, not_found, conflict)" }
        message:    { type: string, description: "Human-readable detail" }
        request_id: { type: string }
        details:
          type: array
          items: { type: string }
