apiVersion: 1

datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    access: proxy
    editable: false
    jsonData:
      # Link Loki labels to Prometheus via `request_id` so clicking a log line
      # takes you to the matching latency/time-series panel.
      derivedFields:
        - datasourceUid: prom
          matcherRegex: 'request_id\":\"([^\"]+)'
          name: request_id
          url: '$${__value.raw}'
