global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # API: Prometheus exposition on :8080/metrics
  - job_name: notifd-api
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  # Worker: dedicated metrics server on :9100/metrics (no app traffic here)
  - job_name: notifd-worker
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: worker

  # Traefik: built-in metrics on :8080/metrics (the default traefik entrypoint)
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]
        labels:
          service: traefik

  # Prometheus itself — sanity check
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
